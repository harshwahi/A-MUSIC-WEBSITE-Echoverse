<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoVerse - Artists</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    margin-top:80px;
}
.artist-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr); /* 4 per row */
    gap: 20px;
    padding: 20px;
}
.artist {
    background: #111;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    transition: 0.3s;
}

.artist-card img{
    width: 100%;
    height: 250px;
    object-fit: cover;
    object-position: top;   
    border-radius: 10px;
}

.artist:hover {
    transform: scale(1.05);
}
@media(max-width:900px){
    .artist-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width:500px){
    .artist-grid {
        grid-template-columns: 1fr;
    }
}

.artist {
    cursor: pointer;
}
</style>

</head>

<body>
