<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    margin:0;
    padding-top:80px;
    background:#000;
    color:white;
}

h2{
    text-align:center;
}

/* GRID */
.songs-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:20px;
    padding:30px;
}

/* CARD */
.song-card{
    background:#111;
    padding:15px;
    border-radius:12px;
    cursor:pointer;
    text-align:center;
    transition:0.3s;
}

.song-card:hover{
    box-shadow:0 0 20px orange;
}

/* IMAGE */
.cover{
    width:100%;
    height:180px;
    object-fit:cover;
    object-position:top;
    border-radius:10px;
}
</style>
</head>

<body>

<h2 id="albumTitle"></h2>

<div class="songs-grid" id="songs"></div>

<audio id="audio"></audio>

<script>

document.getElementById("albumTitle").innerText = "Talwinder Songs";

let songs = [
{ name: "Tu Zaroori", file: "songs/tu-zaroori.mp3", cover: "covers/tu-zaroori.jpg" },
{ name: "boyfriend", file: "songs/boyfriend.mp3", cover: "covers/boyfriend.jpg" },
{ name: "Khayal", file: "songs/khayaal.mp3", cover: "covers/khayaal.jpg" }
];

loadSongs();

let audio = document.getElementById("audio");

function loadSongs(){
    let container = document.getElementById("songs");

    songs.forEach((song,index)=>{
        let card = document.createElement("div");
        card.classList.add("song-card");

        card.innerHTML = `
            <img src="${song.cover}" class="cover">
            <h4>${song.name}</h4>
        `;

        card.onclick = ()=> playSong(index);

        container.appendChild(card);
    });
}

function playSong(index){
    audio.src = songs[index].file;
    audio.play();
}

</script>

</body>
</html>
